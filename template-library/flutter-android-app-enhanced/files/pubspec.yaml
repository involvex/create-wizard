# @format

name: flutter_android_app_enhanced
description: An enhanced Flutter Android app with many built-in features
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State management
  provider: ^6.0.5
  # Navigation
  go_router: ^13.0.1
  # Dependency injection
  get_it: ^7.6.4
  # API handling
  dio: ^5.4.0
  # JSON serialization
  json_annotation: ^4.8.1
  # Localization
  intl: ^0.18.1
  # Theming
  flutter_svg: ^2.0.7
  # Utilities
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  path_provider: ^2.0.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Testing
  mockito: ^5.4.2
  # JSON serialization
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  # Widget testing
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
